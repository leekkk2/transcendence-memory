name: Client contract
on:
  push:
    branches: [main, 'codex/tm-feedback-fixes-*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cross-platform:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned native client
        run: python -c "import json,subprocess,sys; subprocess.run([sys.executable,'-m','pip','install',json.load(open('cli-source.json'))['requirement']],check=True)"
      - name: Test complete installation and native wrappers
        shell: python
        run: |
          import subprocess,sys
          result=subprocess.run([sys.executable,'-m','unittest','discover','-s','tests','-v'],capture_output=True,text=True,encoding='utf-8',errors='replace')
          print(result.stdout);print(result.stderr)
          if result.returncode:
              text=(result.stdout+result.stderr)[-16000:].replace('%','%25').replace('\r','%0D').replace('\n','%0A')
              print('::error title=Client contract::'+text)
          sys.exit(result.returncode)
